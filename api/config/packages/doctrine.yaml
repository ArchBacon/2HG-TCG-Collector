doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '12.3.2-MariaDB&charset=utf8mb4'

        # Disabled: the debug/profiler query middleware (backtraces, stopwatch periods, and
        # query logging) accumulates in memory for the lifetime of the process with no way to
        # clear it mid-run. Bulk imports issuing 100k+ queries (see
        # App\Games\MTG\Command\ImportScryfallCardsCommand) hit OOM from this alone, well
        # before the entity manager's own memory usage matters. Costs the Symfony profiler's
        # Doctrine panel / query log in dev.
        profiling: false
        logging: false
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
            MTG:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Games/MTG/Entity'
                prefix: 'App\Games\MTG\Entity'
                alias: MTG
#            Pokemon:
#                type: attribute
#                is_bundle: false
#                dir: '%kernel.project_dir%/src/Games/Pokemon/Entity'
#                prefix: 'App\Games\Pokemon\Entity'
#                alias: Pokemon
            Lorcana:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Games/Lorcana/Entity'
                prefix: 'App\Games\Lorcana\Entity'
                alias: Lorcana
            OnePiece:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Games/OnePiece/Entity'
                prefix: 'App\Games\OnePiece\Entity'
                alias: OnePiece
            DragonBallFusion:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Games/DragonBallFusion/Entity'
                prefix: 'App\Games\DragonBallFusion\Entity'
                alias: DragonBallFusion

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
