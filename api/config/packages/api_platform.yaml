api_platform:
    title: Hello API Platform
    version: 1.0.0
    name_converter: 'serializer.name_converter.camel_case_to_snake_case'
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        # API Platform defaults this to true itself (SerializerContextBuilder::createFromRequest)
        # whenever a resource's own normalizationContext doesn't set it — dropping every
        # null-valued field from responses instead of serializing it as null. This merges into
        # each resource's own normalizationContext (OperationDefaultsTrait::addGlobalDefaults:
        # array_merge($default, $resourceOwn) when the resource's own context is non-empty), so
        # it applies across every game without touching each entity's #[ApiResource] attribute.
        normalization_context:
            skip_null_values: false
