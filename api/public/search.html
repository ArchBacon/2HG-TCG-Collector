<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — TCG Collector</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="search-header">
    <a href="/index.html" class="logo">TCG Collector</a>
    <form class="search-form" id="search-form">
        <select name="game" id="game" required></select>
        <input type="text" name="q" id="q" placeholder="Card name…" autocomplete="off" required>
        <button type="submit">Search</button>
    </form>
</header>
<main>
    <p id="status"></p>
    <div id="results" class="results-grid"></div>
</main>
<script src="/assets/app.js"></script>
<script>
    const select = document.getElementById('game');
    const input = document.getElementById('q');
    const form = document.getElementById('search-form');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    const params = new URLSearchParams(location.search);
    const initialGame = params.get('game') || GAMES[0].code;
    const initialQuery = params.get('q') || '';

    populateGameSelect(select, initialGame);
    input.value = initialQuery;

    form.addEventListener('submit', (event) => {
        event.preventDefault();
        const game = select.value;
        const q = input.value.trim();
        const url = new URL(location.href);
        url.searchParams.set('game', game);
        url.searchParams.set('q', q);
        history.pushState({}, '', url);
        runSearch(game, q);
    });

    async function runSearch(game, q) {
        results.innerHTML = '';
        if (!q) {
            status.textContent = '';
            return;
        }

        status.textContent = 'Searching…';
        try {
            const response = await fetch(`/api/${game}/cards.jsonld?name=${encodeURIComponent(q)}`, {
                headers: { Accept: 'application/ld+json' },
            });
            if (!response.ok) {
                throw new Error(`Request failed (${response.status})`);
            }

            const data = await response.json();
            const cards = data.member || [];

            if (cards.length === 0) {
                status.textContent = `No cards found for "${q}".`;
                return;
            }

            status.textContent = data.totalItems > cards.length
                ? `${data.totalItems} card(s) found (showing first ${cards.length}).`
                : `${data.totalItems} card(s) found.`;

            for (const card of cards) {
                const el = document.createElement('div');
                el.className = 'card';

                const img = document.createElement('img');
                img.src = card.images?.small ?? '';
                img.alt = card.name;
                img.loading = 'lazy';

                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = card.name;

                el.appendChild(img);
                el.appendChild(name);
                results.appendChild(el);
            }
        } catch (err) {
            status.textContent = `Error: ${err.message}`;
        }
    }

    if (initialQuery) {
        runSearch(initialGame, initialQuery);
    }
</script>
</body>
</html>
