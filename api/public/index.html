<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCG Collector</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main class="home">
    <h1>TCG Collector</h1>
    <p class="tagline">Search cards across every game in the collection.</p>
    <form class="search-form" action="/search.html" method="get">
        <select name="game" id="game" required></select>
        <input type="text" name="q" placeholder="Card name…" autocomplete="off" required>
        <button type="submit">Search</button>
    </form>
</main>
<script src="/assets/app.js"></script>
<script>
    populateGameSelect(document.getElementById('game'));
</script>
</body>
</html>
